<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIDOXX Profile</title>
    <meta name="description" content="Manage your DIDOXX account, profile, shipping details, and saved preferences.">
    <link rel="stylesheet" href="style.css">
</head>

<body class="profile-page">
    <header class="top-nav">
        <a class="brand" href="index.html">DIDOXX</a>
        <nav class="nav-links" id="mainNavLinks">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="purchases.html" class="auth-required" style="display:none;">Orders</a>
            <a href="wishlist.html" class="auth-required" style="display:none;">Wishlist</a>
            <a href="bag.html">Cart</a>
        </nav>
        <div class="nav-actions" id="navAuthActions">
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme"><span class="theme-icon">🌙</span></button>
            <div class="guest-only">
                <a href="signin.html" class="text-link">Sign In</a>
                <a href="signup.html" class="button secondary btn-sm" style="min-height: 36px; padding: 0 16px; font-size: 0.85rem;">Sign Up</a>
            </div>
            <div class="member-only" style="display:none; align-items: center; gap: 12px;">
                <span id="navUserName" style="font-size: 0.9rem; font-weight: 600;"></span>
                <a class="icon-button" href="bag.html" aria-label="Cart">🛒</a>
                <a class="icon-button active" href="account.html" aria-label="Account">👤</a>
                <button class="button secondary btn-sm" style="min-height: 36px; padding: 0 16px; font-size: 0.85rem;" onclick="logoutUser()">Logout</button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="section-block">
            <div class="profile-container">
                <div class="profile-header">
                    <h1>My Account</h1>
                    <p class="section-subtle">Update your profile, delivery details, and personal preferences.</p>
                </div>
                <div class="profile-grid">
                    <div class="profile-card">
                        <div class="profile-pic-wrapper">
                            <img id="profilePicDisplay" class="profile-pic" src="https://via.placeholder.com/240?text=DIDOXX" alt="Profile picture">
                            <label class="profile-pic-label" for="profile_pic_input">Change</label>
                            <input type="file" id="profile_pic_input" accept="image/*" onchange="handleProfilePicChange(event)">
                        </div>
                        <div>
                            <p class="section-subtle">Signature</p>
                            <h2>DIDOXX Member</h2>
                            <p>Stay connected with the latest releases, order updates, and exclusive previews.</p>
                        </div>
                    </div>
                    <form id="profileForm" class="profile-card" onsubmit="saveProfile(event)">
                        <div class="form-group">
                            <label for="profile_name">Full name</label>
                            <input id="profile_name" type="text" disabled>
                        </div>
                        <div class="form-group">
                            <label>Email address</label>
                            <div id="emailDisplay" class="email-display"></div>
                        </div>
                        <div class="form-group">
                            <label for="profile_phone">Phone number</label>
                            <input id="profile_phone" type="tel" disabled>
                        </div>
                        <div class="form-group">
                            <label for="profile_address">Shipping address</label>
                            <textarea id="profile_address" rows="4" disabled></textarea>
                        </div>
                        <div class="profile-actions">
                            <button type="button" id="editBtn" class="button secondary" onclick="enableEditMode()">Edit Profile</button>
                            <button type="submit" id="saveBtn" class="button btn-primary" style="display:none;">Save Changes</button>
                            <button type="button" id="cancelBtn" class="button secondary" style="display:none;" onclick="disableEditMode()">Cancel</button>
                        </div>
                        <div id="successMessage" class="success-message"></div>
                        <div id="errorMessage" class="error-message"></div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
