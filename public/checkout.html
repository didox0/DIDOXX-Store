<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIDOXX Checkout</title>
    <meta name="description" content="Checkout securely with premium delivery and payment options.">
    <link rel="stylesheet" href="style.css">
</head>
<body class="checkout-page">
    <header class="top-nav">
        <a class="brand" href="index.html">DIDOXX</a>
        <nav class="nav-links" id="mainNavLinks">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="purchases.html" class="auth-required" style="display:none;">Orders</a>
            <a href="wishlist.html" class="auth-required" style="display:none;">Wishlist</a>
            <a href="bag.html">Cart</a>
        </nav>
        <div class="nav-actions" id="navAuthActions">
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme"><span class="theme-icon">🌙</span></button>
            <div class="guest-only">
                <a href="signin.html" class="text-link">Sign In</a>
                <a href="signup.html" class="button secondary btn-sm" style="min-height: 36px; padding: 0 16px; font-size: 0.85rem;">Sign Up</a>
            </div>
            <div class="member-only" style="display:none; align-items: center; gap: 12px;">
                <span id="navUserName" style="font-size: 0.9rem; font-weight: 600;"></span>
                <a class="icon-button" href="bag.html" aria-label="Cart">🛒</a>
                <a class="icon-button" href="account.html" aria-label="Account">👤</a>
                <button class="button secondary btn-sm" style="min-height: 36px; padding: 0 16px; font-size: 0.85rem;" onclick="logoutUser()">Logout</button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="section-block checkout-shell">
            <div class="checkout-form-card">
                <h2>Shipping & Payment</h2>
                <label for="delivery_name">Full Name</label>
                <input id="delivery_name" type="text" placeholder="Your name">
                <label for="delivery_phone">Phone</label>
                <input id="delivery_phone" type="text" placeholder="Phone number">
                <label for="delivery_address">Address</label>
                <textarea id="delivery_address" rows="4" placeholder="Street, city, state"></textarea>
                <div class="selector-group">
                    <label>Payment Method</label>
                    <div class="selector-list">
                        <button class="selector-pill">Card</button>
                        <button class="selector-pill">UPI</button>
                        <button class="selector-pill">COD</button>
                    </div>
                </div>
                <button class="button btn-primary" onclick="checkoutCart()">Place Order</button>
            </div>
            <div id="checkoutSummary"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
