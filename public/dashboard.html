<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | DIDOXX</title>
    <meta name="description" content="DIDOXX admin dashboard for products, brands, orders, and customer management.">
    <link rel="stylesheet" href="style.css">
</head>

<body class="admin-page">
    <header class="top-nav">
        <a class="brand" href="index.html">DIDOXX</a>
        <nav class="nav-links" id="mainNavLinks">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="purchases.html" class="auth-required" style="display:none;">Orders</a>
            <a href="wishlist.html" class="auth-required" style="display:none;">Wishlist</a>
            <a href="bag.html">Cart</a>
        </nav>
        <div class="nav-actions" id="navAuthActions">
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme"><span class="theme-icon">🌙</span></button>
            <div class="guest-only">
                <a href="signin.html" class="text-link">Sign In</a>
                <a href="signup.html" class="button secondary btn-sm" style="min-height: 36px; padding: 0 16px; font-size: 0.85rem;">Sign Up</a>
            </div>
            <div class="member-only" style="display:none; align-items: center; gap: 12px;">
                <span id="navUserName" style="font-size: 0.9rem; font-weight: 600;"></span>
                <a class="icon-button" href="bag.html" aria-label="Cart">🛒</a>
                <a class="icon-button active" href="dashboard.html" aria-label="Account">👑</a>
                <button class="button secondary btn-sm" style="min-height: 36px; padding: 0 16px; font-size: 0.85rem;" onclick="logoutUser()">Logout</button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="section-block">
            <div class="section-heading">
                <div>
                    <h2>Admin Dashboard</h2>
                    <p class="section-subtle">Manage products, brands, customers, and inventory for the DIDOXX premium label.</p>
                </div>
            </div>
            <div id="statsGrid" class="stats-grid"></div>
            <div class="section-block" style="padding-top:0;">
                <div class="form-container">
                    <h3>Product Studio</h3>
                    <input type="text" id="admin_product_name" placeholder="Product Name">
                    <input type="text" id="admin_category" placeholder="Category">
                    <input type="number" id="admin_price" placeholder="Price">
                    <input type="number" id="admin_discount" placeholder="Discount %" min="0" max="100">
                    <input type="number" id="admin_stock" placeholder="Stock quantity">
                    <input type="text" id="admin_sizes" placeholder="Sizes (S,M,L,XL)">
                    <input type="text" id="admin_colors" placeholder="Colors (Black,White,Grey)">
                    <input type="text" id="admin_collection" placeholder="Collection">
                    <select id="admin_brand_id">
                        <option value="">Select Brand</option>
                    </select>
                    <input type="file" id="admin_product_image" accept="image/*">
                    <div class="button-row">
                        <button id="addProductBtn" onclick="addProduct()">Add Product</button>
                        <button id="updateProductBtn" onclick="updateProduct()" style="display:none;">Update Product</button>
                        <button id="cancelProductEditBtn" onclick="cancelProductEdit()" style="display:none;">Cancel</button>
                    </div>
                </div>
            </div>
            <section>
                <h3>Product Catalogue</h3>
                <div id="adminProducts" class="admin-grid"></div>
            </section>
            <section>
                <h3>Brand Studio</h3>
                <div class="form-container">
                    <input type="text" id="admin_brand_name" placeholder="Brand Name">
                    <input type="text" id="admin_brand_location" placeholder="Origin">
                    <input type="file" id="admin_brand_image" accept="image/*" onchange="handleBrandImageFile(event)">
                    <img id="admin_brand_preview" src="" alt="Brand preview" style="display:none; width:100%; max-width:320px; border-radius:16px; margin-top:14px;" />
                    <div class="button-row">
                        <button id="addBrandBtn" onclick="addBrand()">Add Brand</button>
                        <button id="updateBrandBtn" onclick="updateBrand()" style="display:none;">Update Brand</button>
                        <button id="cancelBrandEditBtn" onclick="cancelBrandEdit()" style="display:none;">Cancel</button>
                    </div>
                </div>
                <div id="adminBrands" class="admin-grid"></div>
            </section>
            <section>
                <h3>Customers</h3>
                <div id="adminUsers" class="admin-grid"></div>
            </section>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
