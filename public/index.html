<!DOCTYPE html>
<html>

<head>
    <title>DIDOX-KITCHEN</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>DIDOX-KITCHEN</h1>

    <nav class="side-nav">
        <div class="nav-brand">DIDOX-KITCHEN</div>
        <a href="index.html">Home</a>
        <a href="restaurants.html">Restaurants</a>
        <a href="orders.html">Orders</a>
        <a href="cart.html">Cart</a>
        <div class="nav-spacer"></div>
        <a href="profile.html" id="profileAvatar" class="profile-avatar-link" style="display: none;">
            <img src="https://via.placeholder.com/40?text=U" alt="Profile" class="profile-avatar">
            <span class="profile-name" id="profileName" style="display:none"></span>
        </a>
        <a href="addfood.html" id="addFoodLink" style="display: none;">Add Food</a>
        <a href="login.html" id="loginBtn">Login</a>
        <a href="#" onclick="logoutUser(); return false;" id="logoutBtn">Logout</a>
    </nav>

    <main class="main-content">
        <h2>Food Items</h2>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Foods..." onkeyup="searchFoods()">
        </div>

        <div class="filter-box">
            <button class="filter-button active" onclick="filterFoods('All', this)">All</button>
            <button class="filter-button" onclick="filterFoods('Veg', this)">Veg</button>
            <button class="filter-button" onclick="filterFoods('Non-Veg', this)">Non-Veg</button>
            <button class="filter-button" onclick="filterFoods('Beverage', this)">Beverage</button>
            <button class="filter-button" onclick="filterFoods('Dessert', this)">Dessert</button>
        </div>

        <div id="foodList"></div>
    </main>

    <script src="script.js"></script>
</body>

</html>
