<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIDOXX Product | Premium Fashion</title>
    <meta name="description" content="View premium DIDOXX product details, pricing, size options, and reviews.">
    <link rel="stylesheet" href="style.css?v=3">
    <!-- medium-zoom for image zoom effect -->
    <script src="https://unpkg.com/medium-zoom@1.0.6/dist/medium-zoom.min.js"></script>
</head>
<body class="product-page">
    <header class="top-nav" role="navigation" aria-label="Main navigation">
        <a class="brand" href="index.html">DIDOXX</a>
        <nav class="nav-links" id="mainNavLinks">
            <a href="index.html">Home</a>
            <a href="shop.html" class="active">Shop</a>
            <a href="purchases.html" class="auth-required" style="display:none;">Orders</a>
            
            <a href="dashboard.html" class="admin-only" style="display:none;">Dashboard</a>
            <a href="bag.html">Cart</a>
        </nav>
        <div class="nav-actions" id="navAuthActions">
            <button class="mobile-menu-toggle" onclick="toggleMobileMenu()" aria-label="Toggle Menu" style="display:none; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text); padding:0 8px;">&#9776;</button>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme"><span class="theme-icon">🌙</span></button>
            <div class="guest-only">
                <a href="signin.html" class="text-link">Sign In</a>
                <a href="signup.html" class="button secondary btn-sm" style="min-height: 36px; padding: 0 16px; font-size: 0.85rem;">Sign Up</a>
            </div>
            <div class="member-only" style="display:none; align-items: center; gap: 12px;">
                <span id="navUserName" style="font-size: 0.9rem; font-weight: 600;"></span>
                <a class="icon-button" href="bag.html" aria-label="Cart">🛒</a>
                <a class="icon-button" href="account.html" aria-label="Account">👤</a>
                <button class="button secondary btn-sm" style="min-height: 36px; padding: 0 16px; font-size: 0.85rem;" onclick="logoutUser()">Logout</button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div id="productDetailsShell"></div>

        <!-- Reviews -->
        <section class="section-block">
            <div class="section-heading">
                <h2>Customer Reviews</h2>
                <p class="section-subtle">What our community says about this piece.</p>
            </div>
            <div id="reviewList" class="review-grid"></div>
            <form id="reviewForm" class="review-form">
                <h3>Leave a Review</h3>
                <input type="text" id="reviewName" placeholder="Your name" required>
                <textarea id="reviewText" placeholder="Your review" rows="3" required></textarea>
                <button type="submit" class="button btn-primary">Submit Review</button>
            </form>
        </section>

        <!-- Related products -->
        <section class="section-block">
            <div class="section-heading">
                <h2>Related Pieces</h2>
                <p class="section-subtle">Pair this statement piece with refined essentials from the edit.</p>
            </div>
            <div id="relatedProducts" class="product-grid"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
