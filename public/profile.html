<!DOCTYPE html>
<html>

<head>
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-pic-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e74c3c;
            background: #f0f0f0;
        }

        .profile-pic-label {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.3s;
        }

        .profile-pic-label:hover {
            background: #c0392b;
        }

        #profile_pic_input {
            display: none;
        }

        .profile-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #2c3e50;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #e74c3c;
            box-shadow: 0 0 5px rgba(231, 76, 60, 0.3);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: center;
        }

        .form-actions button {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-save {
            background: #27ae60;
            color: white;
        }

        .btn-save:hover {
            background: #229954;
        }

        .btn-cancel {
            background: #95a5a6;
            color: white;
        }

        .btn-cancel:hover {
            background: #7f8c8d;
        }

        .btn-edit {
            background: #3498db;
            color: white;
        }

        .btn-edit:hover {
            background: #2980b9;
        }

        .email-display {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            color: #555;
            font-size: 14px;
        }

        .edit-mode .email-display {
            display: none;
        }

        .edit-mode .form-group input[readonly],
        .edit-mode .form-group input:disabled {
            background: #f8f9fa;
            cursor: not-allowed;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>

<body>

    <nav class="side-nav">
        <div class="nav-brand">DIDOX-KITCHEN</div>
        <a href="index.html">Home</a>
        <a href="restaurants.html">Restaurants</a>
        <a href="orders.html">Orders</a>
        <a href="cart.html">Cart</a>
        <div class="nav-spacer"></div>
        <a href="profile.html" id="profileAvatar" class="profile-avatar-link" style="display: none;">
            <img src="https://via.placeholder.com/40?text=U" alt="Profile" class="profile-avatar">
            <span class="profile-name" id="profileName" style="display:none"></span>
        </a>
        <a href="addfood.html" id="addFoodLink" style="display: none;">Add Food</a>
        <a href="login.html" id="loginBtn">Login</a>
        <a href="#" onclick="logoutUser(); return false;" id="logoutBtn">Logout</a>
    </nav>

    <main class="main-content">
    <div class="profile-container">
        <div class="profile-header">
            <div>
                <h1>My Profile</h1>
            </div>
            <div>
                <button class="btn-cancel" onclick="logoutUser()">Logout</button>
            </div>
        </div>

        <div id="successMessage" class="success-message"></div>
        <div id="errorMessage" class="error-message"></div>

        <div class="profile-pic-wrapper">
            <img id="profilePicDisplay" class="profile-pic" src="https://via.placeholder.com/120?text=No+Photo" alt="Profile Picture">
            <label for="profile_pic_input" class="profile-pic-label">📷</label>
            <input type="file" id="profile_pic_input" accept="image/*" onchange="handleProfilePicChange(event)">
        </div>

        <form class="profile-form" id="profileForm" onsubmit="saveProfile(event)">

            <div class="form-group">
                <label for="profile_name">Full Name</label>
                <input type="text" id="profile_name" placeholder="Your Name" required disabled>
            </div>

            <div class="form-group">
                <label for="profile_email">Email</label>
                <div class="email-display" id="emailDisplay"></div>
                <input type="email" id="profile_email" readonly style="display:none;">
            </div>

            <div class="form-group">
                <label for="profile_phone">Phone Number</label>
                <input type="tel" id="profile_phone" placeholder="Enter your phone number" disabled>
            </div>

            <div class="form-group">
                <label for="profile_address">Address</label>
                <textarea id="profile_address" placeholder="Enter your delivery address" rows="3" disabled></textarea>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-edit" id="editBtn" onclick="enableEditMode()">Edit Profile</button>
                <button type="submit" class="btn-save" id="saveBtn" style="display: none;">Save Changes</button>
                <button type="button" class="btn-cancel" id="cancelBtn" style="display: none;" onclick="disableEditMode()">Cancel</button>
            </div>

        </form>

    </div>

    <script src="script.js"></script>
    <script>
        // Load profile on page load
        document.addEventListener('DOMContentLoaded', loadUserProfile);
    </script>

    </main>

</body>

</html>
