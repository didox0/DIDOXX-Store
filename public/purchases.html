<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIDOXX Orders</title>
    <meta name="description" content="Track your DIDOXX order history, statuses, and delivery updates.">
    <link rel="stylesheet" href="style.css?v=3">
</head>

<body class="orders-page">
    <header class="top-nav">
        <a class="brand" href="index.html">DIDOXX</a>
        <nav class="nav-links" id="mainNavLinks">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="purchases.html" class="active auth-required" style="display:none;">Orders</a>
            
            <a href="dashboard.html" class="admin-only" style="display:none;">Dashboard</a>
            <a href="bag.html">Cart</a>
        </nav>
        <div class="nav-actions" id="navAuthActions">
            <button class="mobile-menu-toggle" onclick="toggleMobileMenu()" aria-label="Toggle Menu" style="display:none; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text); padding:0 8px;">&#9776;</button>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme"><span class="theme-icon">🌙</span></button>
            <div class="guest-only">
                <a href="signin.html" class="text-link">Sign In</a>
                <a href="signup.html" class="button secondary btn-sm" style="min-height: 36px; padding: 0 16px; font-size: 0.85rem;">Sign Up</a>
            </div>
            <div class="member-only" style="display:none; align-items: center; gap: 12px;">
                <span id="navUserName" style="font-size: 0.9rem; font-weight: 600;"></span>
                <a class="icon-button" href="bag.html" aria-label="Cart">🛒</a>
                <a class="icon-button" href="account.html" aria-label="Account">👤</a>
                <button class="button secondary btn-sm" style="min-height: 36px; padding: 0 16px; font-size: 0.85rem;" onclick="logoutUser()">Logout</button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="section-block">
            <div class="section-heading">
                <div>
                    <h2>Order Tracking</h2>
                    <p class="section-subtle">Stay updated with every purchase. See your order progress, delivery status, and tracking information in one place.</p>
                </div>
            </div>
            <div id="orderStats" class="grid-col" style="grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px;"></div>
            <div id="orderList"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
