<!DOCTYPE html>
<html>

<head>
    <title>Register</title>

    <div class="form-container">

        <h1 style="margin-top: 0; font-size: 48px;">Register</h1>

        <a href="login.html">
            Already Have Account?
        </a>

    </div>

    <script src="script.js"></script>

</html>
