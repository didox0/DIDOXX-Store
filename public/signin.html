<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | DIDOXX</title>
    <meta name="description" content="Login to your DIDOXX account to access premium streetwear collections and order history.">
    <link rel="stylesheet" href="style.css?v=3">
</head>

<body class="auth-page"> 
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" style="position: absolute; top: 24px; right: 24px;"><span class="theme-icon">??</span></button>
    <div class="auth-panel">
        <h1>Welcome Back</h1>
        <p class="section-subtle">Sign in to explore your wardrobe, track orders, and unlock exclusive access.</p>
        <div class="auth-actions">
            <input id="login_email" type="email" placeholder="Email address" required>
            <input id="login_password" type="password" placeholder="Password" required>
            <button class="button btn-primary" onclick="loginUser()">Sign In</button>
        </div>
        <p class="auth-note">New to DIDOXX? <a href="signup.html">Create an account</a></p>
    </div>
    <script src="script.js"></script>
</body>

</html>
