<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | DIDOXX</title>
    <meta name="description" content="Create a DIDOXX account and access premium streetwear collections.">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page"> 
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" style="position: absolute; top: 24px; right: 24px;"><span class="theme-icon">🌙</span></button>
    <div class="auth-panel">
        <h1>Create Account</h1>
        <p class="section-subtle">Join DIDOXX and get first access to new releases, exclusive drops, and premium styling.</p>
        <div class="auth-actions">
            <input id="register_name" type="text" placeholder="Full name" required>
            <input id="register_email" type="email" placeholder="Email address" required>
            <input id="register_password" type="password" placeholder="Password" required>
            <button class="button btn-primary" onclick="registerUser()">Create Account</button>
        </div>
        <p class="auth-note">Already a member? <a href="signin.html">Sign in</a></p>
    </div>
    <script src="script.js"></script>
</body>

</html>
